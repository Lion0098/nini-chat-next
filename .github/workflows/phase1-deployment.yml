name: Phase 1 Ubuntu deployment build

on:
  push:
    branches:
      - phase1/ubuntu-deployment
  workflow_dispatch:

permissions:
  contents: write

jobs:
  production-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate stale npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit synchronized lockfile if needed
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: synchronize npm lockfile"
            git push origin HEAD:phase1/ubuntu-deployment
          fi
      - name: Verify clean dependency install
        run: npm ci
      - name: Build production bundle
        run: npm run build
      - name: Build production Docker image
        run: docker build --tag nini-chat:phase1 .
