name: Phase 7 validation

on:
  push:
    branches:
      - phase7/platform-settings-ops
  pull_request:
    branches:
      - main
      - phase7/platform-settings-ops
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run typecheck
      - name: Existing unit and contract tests
        run: npm test
      - name: Phase 7 migration contract checks
        run: node --test scripts/phase7-migration.test.mjs
      - name: Production build
        run: npm run build
