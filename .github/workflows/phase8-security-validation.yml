name: Phase 8 security and reliability validation

on:
  push:
    branches:
      - phase8/security-reliability
      - phase9/project-audit
  pull_request:
    branches:
      - main
      - phase7/platform-settings-ops
      - phase8/security-reliability
      - phase9/project-audit
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase8-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-and-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      # Keep dependency advisories visible without blocking the baseline validation run.
      - name: Audit dependency vulnerabilities (informational baseline)
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Check authentication invariants
        shell: bash
        run: |
          set -euo pipefail
          npm run dev > /tmp/phase8-vite-dev.log 2>&1 &
          DEV_SERVER_PID=$!
          cleanup() {
            kill "$DEV_SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/__app-env >/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$DEV_SERVER_PID" 2>/dev/null; then
              cat /tmp/phase8-vite-dev.log
              echo "Vite dev server exited before becoming ready" >&2
              exit 1
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/phase8-vite-dev.log
            echo "Timed out waiting for Vite dev server at 127.0.0.1:8080" >&2
            exit 1
          fi
          npm run check:auth -- --dev-url http://127.0.0.1:8080

      - name: TypeScript check
        run: npm run typecheck

      - name: Unit and contract tests
        run: npm test

      - name: Phase 7 migration contract checks
        run: node --test scripts/phase7-migration.test.mjs

      - name: Production build
        run: npm run build
